[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasagent"
version = "0.1.0"
description = "Deterministic Canvas guardrail for the HW3 autonomous agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
canvas_tool = "canvas_tool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
